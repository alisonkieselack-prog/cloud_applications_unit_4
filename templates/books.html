{% include 'header.html' %}

<html>
<head>
    <title>My favourite books</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
<header class="'page-header">
  <h1>My favourite books</h1>
</header>

<main>
  <section class="books">
    {% for book in books %}
      <article class="book_item">
          <a href="/books/{{ book.id }}">
            <img src='{{ book.img_url }}'>
            <h2>{{ book.title }}</h2>
            <p><i>by {{ book.author }}</i></p>
          </a>
      </article>
    {% endfor %}
  </section>

<br><br>

  <section class="add_book">
    Members, click <a href='/add_book'>here</a> to add your own books to the list.
  </section>
</main>
</body>
</html>
